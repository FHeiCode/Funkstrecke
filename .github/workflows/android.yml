name: Android-Build

on:
  # Nur Branches: Ein neues Release legt auch einen Tag an; ohne diese Einschränkung liefe der Build doppelt.
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  # Beim Veröffentlichen eines Releases wird die APK automatisch an das Release angehängt.
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # Gradle wird hier geladen; das Projekt enthält absichtlich keine gradlew/gradle-wrapper.jar.
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.8.2"
          # Freier Cache auf Basis des GitHub-Actions-Caches (Standard wäre der kommerzielle Dienst).
          cache-provider: basic

      # Fester Schlüssel aus den Repository-Secrets, damit Updates die installierte App ersetzen dürfen.
      - name: Signaturschlüssel bereitstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/funkstrecke.jks"
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/funkstrecke.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Kein Signaturschlüssel hinterlegt. Diese APK kann eine installierte Version nicht aktualisieren (siehe README)."
          fi

      - name: APK bauen
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle assembleDebug --stacktrace

      - name: APK umbenennen
        run: |
          NAME="funkstrecke-${GITHUB_REF_NAME//\//-}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$NAME"
          # Zusätzlich fester Name: .../releases/latest/download/funkstrecke.apk zeigt immer auf das neueste Release.
          cp app/build/outputs/apk/debug/app-debug.apk funkstrecke.apk
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"

      # Immer: als Artefakt am Build-Lauf (Actions → Lauf → Artifacts)
      - uses: actions/upload-artifact@v7
        with:
          name: funkstrecke-apk
          path: ${{ env.APK_NAME }}

      # Release auf GitHub veröffentlicht: APK an dieses Release hängen (Titel und Text bleiben unverändert).
      - name: APK an Release anhängen
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ env.APK_NAME }}
            funkstrecke.apk
