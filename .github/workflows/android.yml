name: Android-Build

on:
  push:
  pull_request:
  workflow_dispatch:
  # Beim Veröffentlichen eines Releases wird die APK automatisch an das Release angehängt.
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Gradle wird hier geladen; das Projekt enthält absichtlich keine gradlew/gradle-wrapper.jar.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: APK bauen
        run: gradle assembleDebug --stacktrace

      - name: APK umbenennen
        run: |
          NAME="funkstrecke-${GITHUB_REF_NAME//\//-}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$NAME"
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"

      # Immer: als Artefakt am Build-Lauf (Actions → Lauf → Artifacts)
      - uses: actions/upload-artifact@v4
        with:
          name: funkstrecke-apk
          path: ${{ env.APK_NAME }}

      # Nur bei einem veröffentlichten Release: APK an das Release anhängen
      - name: APK an Release anhängen
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_NAME }}
